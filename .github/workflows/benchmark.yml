name: Benchmark

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["*"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare benchmark dependencies
    runs-on: ubuntu-24.04
    outputs:
      node-version: ${{ steps.node.outputs.node-version }}
      dependencies-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        id: node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - name: Define dependency cache key
        id: cache-key
        env:
          DEPENDENCY_KEY: benchmark-dependencies-ubuntu-24.04-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}-ignore-scripts-v1
        run: echo "key=$DEPENDENCY_KEY" >> "$GITHUB_OUTPUT"
      - name: Cache installed benchmark dependencies
        id: dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: node_modules
          key: ${{ steps.cache-key.outputs.key }}
      - run: npm ci --ignore-scripts
        if: steps.dependencies.outputs.cache-hit != 'true'
      - name: Check regressions
        run: node node_modules/vite-node/dist/cli.mjs tests/regressions.ts
      - name: Type-check benchmark fixtures
        run: node node_modules/typescript/bin/tsc -p tsconfig.benchmarks.json

  benchmark:
    name: CPU micro-benchmarks (${{ matrix.count }} instances, ${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'pull_request' && 8 || 1 }}
      matrix:
        count: [1000, 10000]
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '["instances", "spatial", "access", "lifecycle"]' || '["all"]') }}
    env:
      BENCH_COUNT: ${{ matrix.count }}
      BENCH_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.prepare.outputs.node-version }}

      - name: Restore installed benchmark dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: node_modules
          key: ${{ needs.prepare.outputs.dependencies-key }}
      - run: npm ci --ignore-scripts
        if: steps.dependencies.outputs.cache-hit != 'true'

      - name: Run alternating base and PR benchmarks on this runner
        if: github.event_name == 'pull_request'
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          BENCH_TIME: 500
          BENCH_ITERATIONS: 64
        run: |
          baseline_dir="$(mktemp -d "$RUNNER_TEMP/instanced-mesh-base.XXXXXX")"
          git archive "$BASE_REVISION" | tar -x -C "$baseline_dir"
          cp -R benchmarks/. "$baseline_dir/benchmarks/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          run_base() {
            (cd "$baseline_dir" && BENCH_OUTPUT="$GITHUB_WORKSPACE/benchmarks/before-$1.json" node "$GITHUB_WORKSPACE/node_modules/vite-node/dist/cli.mjs" benchmarks/index.ts)
          }
          run_current() {
            BENCH_OUTPUT="$GITHUB_WORKSPACE/benchmarks/after-$1.json" node node_modules/vite-node/dist/cli.mjs benchmarks/index.ts
          }
          for round in 0 1 2; do
            if [ "$((round % 2))" -eq 0 ]; then
              run_base "$round"
              run_current "$round"
            else
              run_current "$round"
              run_base "$round"
            fi
          done

      - name: Run benchmarks
        if: github.event_name == 'push'
        run: npm run bench
        env:
          BENCH_TIME: 500

      - name: Check benchmark history
        id: history
        run: |
          refs="$(git ls-remote --heads origin gh-pages)"
          if [ -n "$refs" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize benchmark history
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.history.outputs.exists == 'false'
        run: |
          git switch --orphan gh-pages
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m "Initialize benchmark history"
          git checkout -

      - name: Summarize first benchmark run
        if: github.event_name == 'push' && steps.history.outputs.exists == 'false'
        run: |
          echo 'No baseline is available yet. The first push to master will initialize benchmark history.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmarks/results.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Compare against baseline
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          tool: customBiggerIsBetter
          output-file-path: benchmarks/results.json
          benchmark-data-dir-path: bench/${{ matrix.count }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          skip-fetch-gh-pages: ${{ steps.history.outputs.exists == 'false' }}
          alert-threshold: "110%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Compare PR against its base on this runner
        if: github.event_name == 'pull_request'
        run: node node_modules/vite-node/dist/cli.mjs --script benchmarks/compare-cli.ts
        env:
          BENCH_ROUNDS: 3
          BENCH_THRESHOLD: 1.1

      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpu-benchmarks-${{ matrix.count }}-${{ matrix.shard }}
          path: benchmarks/*.json
          if-no-files-found: error
