name: Benchmark

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: CPU micro-benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Run benchmarks
        run: npm run bench
        env:
          BENCH_TIME: 500

      - name: Compare against baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customBiggerIsBetter
          output-file-path: benchmarks/results.json
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          alert-threshold: "115%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true
